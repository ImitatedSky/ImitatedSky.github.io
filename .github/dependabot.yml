version: 2
updates:
  # Groups collapse a whole week's updates into one PR per bucket instead of
  # one PR per package (a fresh scan would otherwise open ~10 at once).
  - package-ecosystem: npm
    directory: "/react-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
