<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/MyAvatar.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imisky's Blog</title>
    <!-- Dark mode: apply before first paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        document.documentElement.classList.toggle("dark", t === null ? true : t === "dark");
      })();
    </script>
    <!-- GitHub Pages SPA redirect: restore path from query string -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
